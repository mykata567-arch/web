<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>随机塔防 Demo V0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f141d;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{display:flex;justify-content:center;overflow:hidden}#app{width:min(100vw,520px);height:100vh;position:relative;background:#151c27}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;pointer-events:none}.pill{background:#202a38cc;border:1px solid #3a485c;border-radius:12px;padding:7px 10px;font-size:13px}.bottom{position:absolute;left:0;right:0;bottom:18px;text-align:center}button{border:0;border-radius:14px;padding:12px 24px;background:#4e86ff;color:#fff;font-weight:700;font-size:16px}.modal{position:absolute;inset:0;background:#07101acc;display:none;align-items:center;justify-content:center;padding:18px}.box{width:100%;background:#202a38;border:1px solid #526079;border-radius:20px;padding:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#2b3748;border:1px solid #53647c;border-radius:16px;padding:12px 8px;min-height:180px;text-align:center}.icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;color:#111;font-weight:900;font-size:22px}.small{font-size:12px;color:#aeb8c8;line-height:1.45}.card button{margin-top:10px;width:100%;padding:8px;font-size:13px}.title{font-size:24px;font-weight:900;text-align:center;margin-bottom:12px}.hint{text-align:center;color:#9aa8bb;font-size:12px;margin-top:10px}

+.tower-panel{position:absolute;left:12px;right:12px;bottom:78px;background:#172332f2;border:1px solid #7185a1;border-radius:14px;padding:12px;box-shadow:0 6px 24px #0008}.tower-panel[hidden]{display:none}.tower-panel p{margin:6px 0;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:8px}.actions button{padding:9px 12px;font-size:13px;flex:1}.actions .danger{background:#a63e46}button:disabled{opacity:.5}.tower-panel .close{float:right;padding:5px 10px;background:#36465a;font-size:12px}
</style>
</head>
<body><div id="app">
<canvas id="c"></canvas>
<div class="panel"><div class="pill" id="wave">波次 0/20</div><div class="pill" id="hp">基地 20</div><div class="pill" id="coin">金币 100</div></div>
<div class="bottom"><button id="start">开始第 1 波</button></div>
<section id="tower-panel" class="tower-panel" hidden aria-label="塔详情"><button id="close-tower" class="close">关闭</button><b id="tower-name"></b><p id="tower-stats"></p><p id="tower-skill"></p><p id="tower-hint" role="status"></p><div class="actions"><button id="move-tower">移动</button><button id="destroy-tower" class="danger">摧毁</button></div></section>
<div class="modal" id="modal"><div class="box"><div class="title">随机 3 选 1</div><div class="cards" id="cards"></div><div class="hint">新角色上阵 · 重复角色升星</div></div></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),D=window.devicePixelRatio||1;
let W,H,scale=1;function resize(){W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
const heroes=[
{id:'bill',n:'比尔',g:'比',col:'#e45d55',d:16,spd:.28,r:120,txt:'高速连射'},
{id:'ryu',n:'隆',g:'隆',col:'#f0f2f5',d:32,spd:.9,r:150,txt:'邻近溅射'},
{id:'arthas',n:'阿尔萨斯',g:'霜',col:'#7d93c9',d:26,spd:1.15,r:115,txt:'冰霜减速'},
{id:'pea',n:'豌豆射手',g:'豌',col:'#72c85f',d:18,spd:.52,r:130,txt:'概率双倍伤害'},
{id:'steve',n:'Steve',g:'史',col:'#49a5a8',d:15,spd:.75,r:125,txt:'周期追加伤害'},
{id:'eggy',n:'蛋仔',g:'蛋',col:'#f4cf53',d:22,spd:.95,r:110,txt:'单体击退'}];
const path=[[0,.18],[.78,.18],[.78,.36],[.22,.36],[.22,.56],[.82,.56],[.82,.75],[.16,.75],[.16,.9],[1,.9]];
const slots=[[.2,.11],[.52,.28],[.12,.47],[.56,.48],[.42,.69],[.66,.84]];
let wave=0,hp=20,coins=100,towers=[],enemies=[],shots=[],running=false,spawnQ=0,spawnT=0,last=0;
let selectedTower=null,moving=false,destroyArmed=false;
const el=id=>document.getElementById(id);function ui(){el('wave').textContent=`波次 ${wave}/20`;el('hp').textContent=`基地 ${hp}`;el('coin').textContent=`金币 ${coins}`;el('start').textContent=moving?'取消移动':hp<=0?'基地失守':running?'战斗中…':wave>=20?'已通关':`开始第 ${wave+1} 波`;el('start').disabled=!moving&&(hp<=0||running||wave>=20)}
function posAt(t){t=Math.max(0,Math.min(.999,t));let lens=[],sum=0;for(let i=0;i<path.length-1;i++){let a=path[i],b=path[i+1],l=Math.hypot((b[0]-a[0])*W,(b[1]-a[1])*H);lens.push(l);sum+=l}let d=t*sum,s=0;for(let i=0;i<lens.length;i++){if(d<=s+lens[i]){let a=path[i],b=path[i+1],q=(d-s)/lens[i];return [W*(a[0]+(b[0]-a[0])*q),H*(a[1]+(b[1]-a[1])*q)]}s+=lens[i]}return [W,H*.9]}
function choice(){closeTower();let modal=el('modal'),cards=el('cards');cards.innerHTML='';[...heroes].sort(()=>Math.random()-.5).slice(0,3).forEach(h=>{let own=towers.find(t=>t.id===h.id),d=document.createElement('div');d.className='card';d.innerHTML=`<div class="icon" style="background:${h.col}">${h.g}</div><b>${h.n}</b><div class="small">${h.txt}<br>${own?`已有 ★${own.star}`:'新角色 ★1'}</div><button>选择</button>`;d.querySelector('button').onclick=()=>{if(own){own.star=Math.min(5,own.star+1)}else if(towers.length<6){let s=slots.find(s=>!towerAtSlot(s));towers.push({...h,star:1,cd:0,sx:s[0],sy:s[1],build:0})}modal.style.display='none';ui()};cards.appendChild(d)});modal.style.display='flex'}
function startWave(){if(hp<=0||running||wave>=20)return;wave++;running=true;spawnQ=8+wave*2+(wave%5===0?1:0);spawnT=0;ui()}

function towerAtSlot(s){return towers.find(t=>t.sx===s[0]&&t.sy===s[1])}
function closeTower(){selectedTower=null;moving=false;destroyArmed=false;el('tower-panel').hidden=true;ui()}
function towerDetails(){
  const t=selectedTower;if(!t||!towers.includes(t)){closeTower();return}
  el('tower-panel').hidden=moving;ui();
  el('tower-name').textContent=t.n+' · ★'+t.star;
  el('tower-stats').textContent='基础伤害 '+(t.d*(1+(t.star-1)*.5)).toFixed(0)+' · 攻击间隔 '+(t.spd/(1+(t.star-1)*.08)).toFixed(2)+' 秒 · 射程 '+t.r;
  const descriptions={bill:'高速攻击前方敌人。',ryu:'对路径进度接近目标的敌人附加 75% 伤害。',arthas:'使目标减速 45%，持续 1.5 秒。',pea:'每次攻击有 '+Math.round((.18+.08*t.star)*100)+'% 概率造成双倍伤害。',steve:'每攻击 8 次，追加两倍基础伤害。',eggy:'将单个目标沿路径向后击退。'};
  el('tower-skill').textContent=t.txt+'：'+descriptions[t.id];
  el('tower-hint').textContent=destroyArmed?'再次点击确认摧毁；不返还金币。':moving?'点击绿色空塔位完成移动；点击移动按钮可取消。':'点击塔查看详情；移动免费，摧毁不返还金币。';
  el('move-tower').textContent=moving?'取消移动':'移动';
  el('destroy-tower').textContent=destroyArmed?'确认摧毁':'摧毁';
}
el('close-tower').onclick=closeTower;
el('move-tower').onclick=()=>{if(!selectedTower)return;moving=!moving;destroyArmed=false;towerDetails()};
el('destroy-tower').onclick=()=>{
  if(!selectedTower)return;
  if(!destroyArmed){destroyArmed=true;moving=false;towerDetails();return}
  towers=towers.filter(t=>t!==selectedTower);closeTower();ui();
};
c.onpointerdown=e=>{
  if(el('modal').style.display==='flex'||hp<=0)return;
  const rect=c.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width,py=(e.clientY-rect.top)*H/rect.height;
  const slot=slots.find(s=>Math.hypot(px-s[0]*W,py-s[1]*H)<=28);
  if(moving&&selectedTower){
    if(slot&&!towerAtSlot(slot)){selectedTower.sx=slot[0];selectedTower.sy=slot[1];moving=false;towerDetails()}
    else el('tower-hint').textContent='请选择绿色的空塔位，已占用的位置不能移动。';
    return;
  }
  const t=slot&&towerAtSlot(slot);
  if(!t){closeTower();return}
  selectedTower=t;moving=false;destroyArmed=false;towerDetails();
};

el('start').onclick=()=>{if(moving){closeTower();return}startWave()};choice();
function spawn(){let boss=wave%5===0&&spawnQ===1,base=34+wave*10;enemies.push({p:0,hp:boss?base*8:base,max:boss?base*8:base,spd:(boss?.018:.028)+wave*.0004,boss,slow:0});spawnQ--}
function fire(t,dt){t.cd-=dt;if(t.cd>0)return;let tx=t.sx*W,ty=t.sy*H,target=null,bd=-1;for(let e of enemies){if(e.hp<=0||e.p>=1)continue;let [ex,ey]=posAt(e.p),dist=Math.hypot(ex-tx,ey-ty);if(dist<t.r&&e.p>bd){target=e;bd=e.p}}if(!target)return;t.cd=t.spd/(1+(t.star-1)*.08);let dmg=t.d*(1+(t.star-1)*.5);if(t.id==='pea'&&Math.random()<.18+.08*t.star)dmg*=2;if(t.id==='arthas')target.slow=1.5;if(t.id==='eggy')target.p=Math.max(0,target.p-(.012+t.star*.003));if(t.id==='ryu'){for(let e of enemies)if(e.hp>0&&e.p<1&&Math.abs(e.p-target.p)<.03)e.hp-=dmg*.75}target.hp-=dmg;let [ex,ey]=posAt(target.p);shots.push({x1:tx,y1:ty,x2:ex,y2:ey,life:.09,col:t.col});if(t.id==='steve'){t.build+=t.spd;if(t.build>5.5){t.build=0;target.hp-=dmg*2;shots.push({x1:tx-10,y1:ty+20,x2:ex,y2:ey,life:.16,col:'#e8c36e'})}}}
function update(dt){
  if(!running)return;
  const previousHp=hp,previousCoins=coins;
  spawnT-=dt;
  if(spawnQ>0&&spawnT<=0){spawn();spawnT=.55}
  for(let e of enemies){
    if(e.hp<=0)continue;
    e.slow=Math.max(0,e.slow-dt);
    e.p+=e.spd*(e.slow>0?.55:1)*dt;
    if(e.p>=1){hp=Math.max(0,hp-(e.boss?5:1));e.hp=0}
  }
  // Resolve defeat before attacks, rewards, or wave completion.
  if(hp<=0){
    running=false;
    ui();
    alert('基地失守，重新开始吧。');
    location.reload();
    return;
  }
  for(let t of towers)fire(t,dt);
  for(let e of enemies)if(e.hp<=0&&e.p<1){coins+=e.boss?40:2}
  enemies=enemies.filter(e=>e.hp>0&&e.p<1);
  shots.forEach(s=>s.life-=dt);
  shots=shots.filter(s=>s.life>0);
  if(spawnQ<=0&&enemies.length===0){
    running=false;
    coins+=15+wave*2;
    ui();
    if(wave<20&&[1,3,5,8,11,14,17].includes(wave))choice();
    if(wave===20)alert('通关！你守住了 20 波。');
  }else if(hp!==previousHp||coins!==previousCoins){
    ui();
  }
}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#151c27';x.fillRect(0,0,W,H);x.lineCap='round';x.lineJoin='round';x.strokeStyle='#384659';x.lineWidth=44;x.beginPath();path.forEach((p,i)=>{let X=p[0]*W,Y=p[1]*H;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.strokeStyle='#65758d';x.lineWidth=2;x.stroke();slots.forEach((s,i)=>{let X=s[0]*W,Y=s[1]*H;x.beginPath();x.arc(X,Y,25,0,Math.PI*2);x.fillStyle=moving&&!towerAtSlot(s)?'#235d49':'#202a38';x.fill();x.strokeStyle=moving&&!towerAtSlot(s)?'#70efb5':'#4e5d72';x.stroke()});if(selectedTower){x.beginPath();x.arc(selectedTower.sx*W,selectedTower.sy*H,selectedTower.r,0,Math.PI*2);x.fillStyle='#7eb9ff18';x.fill();x.strokeStyle='#9dcbff';x.lineWidth=1;x.stroke()}for(let t of towers){let X=t.sx*W,Y=t.sy*H;x.beginPath();x.arc(X,Y,21,0,Math.PI*2);x.fillStyle=t.col;x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#111';x.font='bold 14px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t.g,X,Y);x.fillStyle='#ffd85a';x.font='11px sans-serif';x.fillText('★'.repeat(t.star),X,Y+32);x.font='10px sans-serif';x.fillStyle='#dfeaff';x.fillText(t.txt,X,Y-30)}for(let e of enemies){let [X,Y]=posAt(e.p);x.beginPath();x.arc(X,Y,e.boss?18:11,0,Math.PI*2);x.fillStyle=e.boss?'#d84c99':'#d65f67';x.fill();if(e.slow>0){x.strokeStyle='#9de6ff';x.stroke()}x.fillStyle='#111';x.fillRect(X-16,Y-20,32,4);x.fillStyle='#75df78';x.fillRect(X-16,Y-20,32*Math.max(0,e.hp/e.max),4)}for(let s of shots){x.globalAlpha=Math.min(1,s.life*10);x.strokeStyle=s.col;x.lineWidth=3;x.beginPath();x.moveTo(s.x1,s.y1);x.lineTo(s.x2,s.y2);x.stroke()}x.globalAlpha=1}
function loop(ts){let now=ts/1000,dt=Math.min(.033,last?now-last:.016);last=now;update(dt);draw();requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);
</script></body></html>
